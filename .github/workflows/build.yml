name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/CarAmbient.apk
          cp guestbook/build/outputs/apk/debug/*.apk out/GuestBook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarAmbient-apk
          path: out/CarAmbient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GuestBook-apk
          path: out/GuestBook.apk
