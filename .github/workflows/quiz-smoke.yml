name: Quiz Duel smoke test

# Installs Quiz Duel on an Android 11 emulator, opens it, and fails if it crashes.
on:
  push:
    paths:
      - "quiz/**"
      - "carlib/**"
      - ".github/workflows/quiz-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Quiz Duel
        run: gradle :quiz:assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: bash .github/scripts/quiz-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiz-smoke-logs
          path: smoke/
